# 人脸表情识别YOLO配置文件
# 数据集路径配置
path: D:/AIGC/yolo/datasets/face_expression  # 数据集根目录
train: images/train  # 训练图片目录
val: images/val      # 验证图片目录
test: images/test    # 测试图片目录

# 类别数量和名称
nc: 7  # 表情类别数量
names: ['happy', 
        'sad', 
        'angry', 
        'surprised', 
        'fearful', 
        'disgusted', 
        'neutral']  # 表情类别名称

# 数据增强参数
augment: true
hsv_h: 0.015  # 色调变化
hsv_s: 0.7    # 饱和度变化
hsv_v: 0.4    # 明度变化
degrees: 0.0  # 旋转角度
translate: 0.1  # 平移
scale: 0.5     # 缩放
shear: 0.0     # 剪切
perspective: 0.0  # 透视变换
flipud: 0.0    # 上下翻转
fliplr: 0.5    # 左右翻转
mosaic: 1.0    # 马赛克增强
mixup: 0.0     # 混合增强
